name: Build Radio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download Custom App Icon
      run: |
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-mdpi
        
        # Descarga tu imagen seleccionada
        curl -sL "https://i.postimg.cc/W1xRCJW9/IMG-1679.jpg" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
        
        # Copia para todas las densidades de pantalla y nombres de icono
        for dir in mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg app/src/main/res/$dir/ic_launcher.jpg
        done
        for dir in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do
          cp app/src/main/res/$dir/ic_launcher.jpg app/src/main/res/$dir/ic_launcher_round.jpg
        done

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DonOmar-Radio-Sessions
        path: app/build/outputs/apk/release/*.apk








