name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Rebuild Clean Source Tree
        run: |
          rm -rf app/Src app/src
          mkdir -p app/src/main/java/com/donomar/radio
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 1. AndroidManifest.xml con todos los permisos requeridos
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Don Omar Radio"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".StreamService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 2. MainActivity.kt con solicitud de permisos en tiempo de ejecucion
          cat << 'EOF' > app/src/main/java/com/donomar/radio/MainActivity.kt
          package com.donomar.radio

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private val REQUEST_MEDIA_PROJECTION = 1001
              private val REQUEST_PERMISSIONS = 1002

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 80, 40, 40)
                  }

                  val btnStart = Button(this).apply {
                      text = "Iniciar Transmisión"
                      setOnClickListener {
                          checkAndRequestPermissions()
                      }
                  }

                  val btnStop = Button(this).apply {
                      text = "Detener Transmisión"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, StreamService::class.java))
                          Toast.makeText(this@MainActivity, "Transmisión detenida", Toast.LENGTH_SHORT).show()
                      }
                  }

                  layout.addView(btnStart)
                  layout.addView(btnStop)
                  setContentView(layout)
              }

              private fun checkAndRequestPermissions() {
                  val permissionsNeeded = mutableListOf<String>()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      permissionsNeeded.add(Manifest.permission.RECORD_AUDIO)
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }

                  if (permissionsNeeded.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), REQUEST_PERMISSIONS)
                  } else {
                      startProjection()
                  }
              }

              private fun startProjection() {
                  val mediaProjectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mediaProjectionManager.createScreenCaptureIntent(), REQUEST_MEDIA_PROJECTION)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == REQUEST_PERMISSIONS) {
                      val allGranted = grantResults.isNotEmpty() && grantResults.all { it == PackageManager.PERMISSION_GRANTED }
                      if (allGranted) {
                          startProjection()
                      } else {
                          Toast.makeText(this, "Permisos necesarios no otorgados", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQUEST_MEDIA_PROJECTION) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val serviceIntent = Intent(this, StreamService::class.java).apply {
                              putExtra("RESULT_CODE", resultCode)
                              putExtra("DATA", data)
                          }
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(serviceIntent)
                              } else {
                                  startService(serviceIntent)
                              }
                              Toast.makeText(this, "Transmisión iniciada", Toast.LENGTH_SHORT).show()
                          } catch (e: Exception) {
                              Toast.makeText(this, "Error al iniciar: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      } else {
                          Toast.makeText(this, "Permiso de captura cancelado", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }
          EOF

          # 3. StreamService.kt
          cat << 'EOF' > app/src/main/java/com/donomar/radio/StreamService.kt
          package com.donomar.radio

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class StreamService : Service {
              constructor() : super()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val channelId = "radio_stream_channel"
                  val channelName = "Transmisión en Vivo"

                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, channelName, NotificationManager.IMPORTANCE_LOW)
                      manager.createNotificationChannel(channel)
                  }

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Don Omar Radio")
                      .setContentText("Transmitiendo audio...")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .build()

                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                      } else {
                          startForeground(101, notification)
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }

                  return START_STICKY
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DonOmarRadio-APK
          path: app/build/outputs/apk/debug/app-debug.apk






