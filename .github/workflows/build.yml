name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Rebuild Clean Source Tree
        run: |
          rm -rf app/Src app/src
          mkdir -p app/src/main/java/com/donomar/radio
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # Dependencias (OkHttp para WebSocket)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.donomar.radio'
              compileSdk 34

              defaultConfig {
                  applicationId "com.donomar.radio"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Don Omar Radio"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".StreamService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/donomar/radio/MainActivity.kt
          package com.donomar.radio

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private val REQUEST_MEDIA_PROJECTION = 1001
              private val REQUEST_PERMISSIONS = 1002
              private lateinit var txtStatus: TextView
              private lateinit var editUrl: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(50, 50, 50, 50)
                  }

                  val title = TextView(this).apply {
                      text = "📻 DON OMAR RADIO"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }

                  txtStatus = TextView(this).apply {
                      text = "⚪ DETENIDO"
                      textSize = 16f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 30)
                  }

                  editUrl = EditText(this).apply {
                      hint = "wss://tu-servidor.onrender.com/broadcast"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#2A2A2A"))
                      setPadding(30, 20, 30, 20)
                  }

                  val btnStart = Button(this).apply {
                      text = "▶ INICIAR TRANSMISIÓN"
                      setBackgroundColor(Color.parseColor("#1DB954"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { checkAndRequestPermissions() }
                  }

                  val btnStop = Button(this).apply {
                      text = "⏹ DETENER"
                      setBackgroundColor(Color.parseColor("#E50914"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, StreamService::class.java))
                          txtStatus.text = "⚪ DETENIDO"
                          txtStatus.setTextColor(Color.LTGRAY)
                          Toast.makeText(this@MainActivity, "Transmisión detenida", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val spacer1 = LinearLayout(this).apply { layoutParams = LinearLayout.LayoutParams(1, 30) }
                  val spacer2 = LinearLayout(this).apply { layoutParams = LinearLayout.LayoutParams(1, 20) }

                  layout.addView(title)
                  layout.addView(txtStatus)
                  layout.addView(editUrl)
                  layout.addView(spacer1)
                  layout.addView(btnStart)
                  layout.addView(spacer2)
                  layout.addView(btnStop)

                  setContentView(layout)
              }

              private fun checkAndRequestPermissions() {
                  val permissionsNeeded = mutableListOf<String>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      permissionsNeeded.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }

                  if (permissionsNeeded.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), REQUEST_PERMISSIONS)
                  } else {
                      startProjection()
                  }
              }

              private fun startProjection() {
                  val mediaProjectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mediaProjectionManager.createScreenCaptureIntent(), REQUEST_MEDIA_PROJECTION)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == REQUEST_PERMISSIONS && grantResults.isNotEmpty() && grantResults.all { it == PackageManager.PERMISSION_GRANTED }) {
                      startProjection()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQUEST_MEDIA_PROJECTION && resultCode == Activity.RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, StreamService::class.java).apply {
                          putExtra("RESULT_CODE", resultCode)
                          putExtra("DATA", data)
                          putExtra("WS_URL", editUrl.text.toString().trim())
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      txtStatus.text = "🔴 EN VIVO / TRANSMITIENDO"
                      txtStatus.setTextColor(Color.parseColor("#00FF66"))
                  }
              }
          }
          EOF

          # StreamService.kt con captura interna de audio y envío WebSocket
          cat << 'EOF' > app/src/main/java/com/donomar/radio/StreamService.kt
          package com.donomar.radio

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import okio.ByteString.Companion.toByteString

          class StreamService : Service() {
              private var mediaProjection: MediaProjection? = null
              private var audioRecord: AudioRecord? = null
              private var webSocket: WebSocket? = null
              private var isStreaming = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val channelId = "radio_stream_channel"
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      manager.createNotificationChannel(NotificationChannel(channelId, "Transmisión", NotificationManager.IMPORTANCE_LOW))
                  }

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Don Omar Radio")
                      .setContentText("Transmitiendo audio...")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(101, notification)
                  }

                  val resultCode = intent?.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  val data = intent?.getParcelableExtra<Intent>("DATA")
                  val wsUrl = intent?.getStringExtra("WS_URL") ?: ""

                  if (resultCode == Activity.RESULT_OK && data != null) {
                      startAudioStreaming(resultCode, data, wsUrl)
                  }

                  return START_STICKY
              }

              @SuppressLint("MissingPermission")
              private fun startAudioStreaming(resultCode: Int, data: Intent, wsUrl: String) {
                  val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = projectionManager.getMediaProjection(resultCode, data)

                  if (wsUrl.isNotEmpty()) {
                      val client = OkHttpClient()
                      val request = Request.Builder().url(wsUrl).build()
                      webSocket = client.newWebSocket(request, object : WebSocketListener() {})
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q && mediaProjection != null) {
                      val config = AudioPlaybackCaptureConfiguration.Builder(mediaProjection!!)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .build()

                      val sampleRate = 44100
                      val channelConfig = AudioFormat.CHANNEL_IN_STEREO
                      val audioFormat = AudioFormat.ENCODING_PCM_16BIT
                      val bufferSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioFormat)

                      audioRecord = AudioRecord.Builder()
                          .setAudioFormat(AudioFormat.Builder()
                              .setEncoding(audioFormat)
                              .setSampleRate(sampleRate)
                              .setChannelMask(channelConfig)
                              .build())
                          .setAudioPlaybackCaptureConfig(config)
                          .setBufferSizeInBytes(bufferSize)
                          .build()

                      audioRecord?.startRecording()
                      isStreaming = true

                      Thread {
                          val buffer = ByteArray(bufferSize)
                          while (isStreaming) {
                              val read = audioRecord?.read(buffer, 0, buffer.size) ?: 0
                              if (read > 0 && webSocket != null) {
                                  webSocket?.send(buffer.toByteString(0, read))
                              }
                          }
                      }.start()
                  }
              }

              override fun onDestroy() {
                  isStreaming = false
                  try {
                      audioRecord?.stop()
                      audioRecord?.release()
                      mediaProjection?.stop()
                      webSocket?.close(1000, "Detenido por el usuario")
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DonOmarRadio-APK
          path: app/build/outputs/apk/debug/app-debug.apk







