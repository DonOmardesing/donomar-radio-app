name: Build Radio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download Custom App Icon
      run: |
        sudo apt-get update && sudo apt-get install -y imagemagick
        curl -sL "https://i.postimg.cc/W1xRCJW9/IMG-1679.jpg" -o temp_icon.jpg
        convert temp_icon.jpg temp_icon.png
        
        for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          mkdir -p app/src/main/res/$dir
          cp temp_icon.png app/src/main/res/$dir/ic_launcher.png
          cp temp_icon.png app/src/main/res/$dir/ic_launcher_round.png
        done

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DonOmar-Radio-Sessions
        path: app/build/outputs/apk/debug/*.apk









