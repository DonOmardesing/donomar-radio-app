name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Directory Structure and Manifest
        run: |
          mkdir -p app/src/main/java app/src/main/res
          # Unificar archivos de carpetas con mayúsculas
          [ -d "app/Src/main/Java" ] && cp -r app/Src/main/Java/* app/src/main/java/ || true
          [ -d "app/Src/main/java" ] && cp -r app/Src/main/java/* app/src/main/java/ || true
          [ -d "app/Src/main/res" ] && cp -r app/Src/main/res/* app/src/main/res/ || true
          [ -d "app/src/Main/res" ] && cp -r app/src/Main/res/* app/src/main/res/ || true
          # Corregir nombre del manifiesto
          if [ -f "app/src/main/androidmanifiest.xml" ]; then
            mv app/src/main/androidmanifiest.xml app/src/main/AndroidManifest.xml
          fi
          # Asegurar carpetas mínimas de recursos
          mkdir -p app/src/main/res/values app/src/main/res/drawable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DonOmarRadio-APK
          path: app/build/outputs/apk/debug/app-debug.apk



